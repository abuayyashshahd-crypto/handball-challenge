<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handball Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081525;color:white;font-family:Arial;text-align:center}
main{max-width:480px;margin:auto;padding:12px}
h1{color:#ffd166;margin:12px}
input,button{padding:12px;border:0;border-radius:12px;font-size:16px}
input{width:58%}
button{background:#ffd166;color:#081525;font-weight:bold}
.stats{display:flex;justify-content:space-around;background:#162c42;padding:12px;border-radius:12px;margin:12px 0}
.stats b{display:block;color:#ffd166;font-size:23px;margin-top:5px}
canvas{width:100%;display:block;border-radius:14px;touch-action:none;user-select:none}
#msg{min-height:25px;color:#ffd166;font-weight:bold}
li{padding:7px}
</style>
</head>
<body>
<main>
<h1>🏆 HANDBALL ARENA</h1>
<p>تحدي الأبطال</p>
<input id="name" placeholder="اسم اللاعب" maxlength="30">
<button id="start">ابدأ اللعب</button>
<div class="stats">
<div>الأهداف<b id="score">0</b></div>
<div>الرميات<b id="left">10</b></div>
<div>الوقت<b id="time">0.0</b></div>
<div>Combo<b id="combo">0</b></div>
</div>
<canvas id="game" width="360" height="440"></canvas>
<p id="msg">اكتب اسمك وابدأ التحدي!</p>
<button id="share" hidden>مشاركة النتيجة</button>
<h3>🏅 أبطال الملعب على جهازك</h3>
<ol id="rank"></ol>
</main>
<script>
const $=s=>document.getElementById(s);
const c=$('game'),g=c.getContext('2d');
let score=0,left=10,combo=0,active=false;
let start=0,elapsed=0,name='',drag=null,shot=null;
let k=180,phase=0,last=0,particles=[],records=[];
let audio=null,flash=0;
const origin={x:180,y:375};

try{records=JSON.parse(localStorage.getItem('arenaScores')||'[]')}catch(e){}

function ranking(){
$('rank').replaceChildren();
records.slice(0,10).forEach(r=>{
let li=document.createElement('li');
li.textContent=r.name+' | '+r.score+'/10 | '+r.time.toFixed(1)+' ثانية';
$('rank').append(li);
});
}
ranking();

function sound(ok){
try{
if(!audio)return;
let o=audio.createOscillator(),v=audio.createGain();
o.connect(v);v.connect(audio.destination);
o.frequency.setValueAtTime(ok?650:150,audio.currentTime);
o.frequency.exponentialRampToValueAtTime(ok?1200:70,audio.currentTime+.15);
v.gain.setValueAtTime(.08,audio.currentTime);
v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);
o.start();o.stop(audio.currentTime+.22);
}catch(e){}
}

function stats(){
$('score').textContent=score;
$('left').textContent=left;
$('combo').textContent=combo;
}

$('start').onclick=()=>{
name=$('name').value.trim();
if(!name){$('msg').textContent='اكتب اسمك أولاً';return}
try{
audio=audio||new(window.AudioContext||window.webkitAudioContext)();
audio.resume();
}catch(e){}
score=0;left=10;combo=0;
drag=null;shot=null;particles=[];
active=true;start=performance.now();
$('share').hidden=true;
$('msg').textContent='اسحب الكرة بسرعة نحو المرمى وأفلتها!';
stats();
};

function pos(e){
let r=c.getBoundingClientRect();
return{x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*440/r.height};
}

c.addEventListener('pointerdown',e=>{
if(!active||shot||!left)return;
let p=pos(e);
if(Math.hypot(p.x-180,p.y-375)>60)return;
drag={from:p,to:p,t:performance.now()};
try{c.setPointerCapture(e.pointerId)}catch(e){}
});

c.addEventListener('pointermove',e=>{
if(drag)drag.to=pos(e);
});

c.addEventListener('pointercancel',()=>drag=null);

c.addEventListener('pointerup',e=>{
if(!drag)return;
let p=pos(e);
let dx=p.x-drag.from.x;
let dy=p.y-drag.from.y;
let duration=Math.max(50,performance.now()-drag.t);
drag=null;
if(dy>-12)return;
let speed=Math.hypot(dx,dy)/duration;
let targetX=180+dx*290/Math.abs(dy);
let targetY=Math.max(32,Math.min(132,130-Math.abs(dy)*.35));
shot={x:targetX,y:targetY,t:performance.now(),duration:Math.max(140,Math.min(400,330-speed*120))};
left--;stats();
});

function finish(t){
active=false;
elapsed=(t-start)/1000;
$('time').textContent=elapsed.toFixed(1);
records.push({name,score,time:elapsed});
records.sort((a,b)=>b.score-a.score||a.time-b.time);
records=records.slice(0,50);
try{localStorage.setItem('arenaScores',JSON.stringify(records))}catch(e){}
ranking();
$('msg').textContent=name+' 🏆 '+score+'/10 — '+elapsed.toFixed(1)+' ثانية';
$('share').hidden=false;
}

$('share').onclick=async()=>{
let text='🏆 '+name+' | Handball Arena | '+score+'/10 | '+elapsed.toFixed(1)+' ثانية '+location.href;
try{
if(navigator.share)await navigator.share({text});
else{await navigator.clipboard.writeText(text);$('msg').textContent='تم نسخ النتيجة والرابط'}
}catch(e){prompt('انسخ نتيجتك',text)}
};

function burst(x,y){
for(let i=0;i<25;i++){
let a=Math.random()*Math.PI*2;
particles.push({x,y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,life:1,color:['#ffd166','#42ffab','#ffffff'][i%3]});
}
}

function line(x,y,a,b,color,w){
g.strokeStyle=color;g.lineWidth=w;
g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke();
}

function ball(x,y,r){
let gr=g.createRadialGradient(x-r*.3,y-r*.4,1,x,y,r);
gr.addColorStop(0,'#ffdf99');
gr.addColorStop(1,'#ed641f');
g.fillStyle=gr;
g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
g.strokeStyle='#8b411e';g.lineWidth=1.5;
g.beginPath();g.moveTo(x-r,y);
g.quadraticCurveTo(x,y-r,x+r,y);
g.moveTo(x,y-r);g.quadraticCurveTo(x+r,y,x,y+r);g.stroke();
}

function frame(t){
let dt=Math.min(.04,(t-last)/1000||0);
last=t;
phase+=dt*(2.5+score*.28);
k=180+Math.sin(phase)*105;
if(active)$('time').textContent=((t-start)/1000).toFixed(1);

g.fillStyle='#c58c52';g.fillRect(0,0,360,440);
for(let i=0;i<440;i+=24){
g.fillStyle=i%48===0?'#ffffff0b':'#00000009';
g.fillRect(0,i,360,24);
}

g.fillStyle='#176b88';
g.beginPath();g.ellipse(180,90,170,170,0,0,Math.PI);g.fill();
g.strokeStyle='white';g.lineWidth=3;g.stroke();

g.strokeStyle='#ffffffaa';
g.setLineDash([9,9]);
g.beginPath();g.ellipse(180,90,195,225,0,0,Math.PI);g.stroke();
g.setLineDash([]);

g.fillStyle='#122b3b';g.fillRect(35,20,290,125);
for(let i=35;i<325;i+=13)line(i,20,i,145,'#55717e',1);
for(let i=20;i<145;i+=13)line(35,i,325,i,'#55717e',1);
g.lineWidth=8;g.strokeStyle='white';g.strokeRect(35,20,290,125);
g.strokeStyle='#e74848';g.setLineDash([14,14]);g.strokeRect(35,20,290,125);g.setLineDash([]);

g.lineCap='round';
let arm=Math.sin(t/170)*12;
line(k-37,55+arm,k,78,'#ffd166',12);
line(k+37,55-arm,k,78,'#ffd166',12);
line(k,100,k-21,138,'#142638',12);
line(k,100,k+21,138,'#142638',12);
g.fillStyle='#ffd166';g.fillRect(k-17,65,34,40);
g.fillStyle='#efb98f';g.beginPath();g.arc(k,49,12,0,7);g.fill();

if(shot){
let p=Math.min(1,(t-shot.t)/shot.duration);
let x=180+(shot.x-180)*p;
let y=375+(shot.y-375)*p;
for(let j=4;j>0;j--){
let q=Math.max(0,p-j*.035);
g.globalAlpha=.12;
ball(180+(shot.x-180)*q,375+(shot.y-375)*q,10);
}
g.globalAlpha=1;
ball(x,y,18-10*p);
if(p===1){
let ok=x>43&&x<317&&Math.abs(x-k)>(y<90?40:26);
if(ok){
score++;combo++;burst(x,y);flash=.3;
$('msg').textContent=combo>=3?'🔥 COMBO ×'+combo:'⚡ هدف رائع!';
}else{
combo=0;$('msg').textContent='حاول مرة أخرى!';
}
sound(ok);shot=null;stats();
if(!left)finish(t);
}
}else if(left){
let x=180,y=375;
if(drag){
x+=Math.max(-45,Math.min(45,drag.to.x-drag.from.x));
y+=Math.max(-55,Math.min(35,drag.to.y-drag.from.y));
}
ball(x,y,19);
}

particles=particles.filter(p=>p.life>0);
particles.forEach(p=>{
p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8;
g.globalAlpha=Math.max(0,p.life);
g.fillStyle=p.color;g.fillRect(p.x,p.y,5,7);
});
g.globalAlpha=1;
if(flash>0){
g.fillStyle='rgba(50,255,150,'+flash*.35+')';
g.fillRect(0,0,360,440);flash-=dt;
}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
