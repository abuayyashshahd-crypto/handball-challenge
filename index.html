<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handball Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102638;color:white;font:16px Arial;text-align:center}
main{max-width:460px;margin:auto;padding:16px}
input,button{font:inherit;padding:12px;border:0;border-radius:10px}
button{background:#ffd166;color:#102638;font-weight:bold;cursor:pointer}
canvas{width:100%;display:block;touch-action:none;border-radius:12px;user-select:none}
#stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;margin:16px 0}
li{padding:6px}
input{width:60%}
</style>
</head>
<body>
<main>
<h1>🏆 تحدي كرة اليد</h1>
<input id="name" maxlength="30" placeholder="اسم اللاعب">
<button id="start">ابدأ</button>
<div id="stats">
<span>اللاعب: <b id="player">—</b></span>
<span>الأهداف: <b id="score">0</b></span>
<span>الرميات: <b id="left">10</b></span>
<span>الوقت: <b id="timer">00:00.0</b></span>
</div>
<canvas id="court" width="340" height="400"></canvas>
<p id="msg">اكتب اسمك واضغط ابدأ</p>
<button id="share" hidden>مشاركة نتيجتي</button>
<h3>🏅 أفضل النتائج على هذا الجهاز</h3>
<ol id="rank"></ol>
</main>
<script>
const $=id=>document.getElementById(id);
const c=$('court'),g=c.getContext('2d');
let x=170,y=345,k=170,score=0,left=10;
let active=false,drag=false,player='';
let flight=null,records=[],started=0,elapsed=0;

function fmt(ms){
if(!Number.isFinite(ms))return 'غير مسجل';
let n=Math.floor(ms/100);
return String(Math.floor(n/600)).padStart(2,'0')+':'+String(Math.floor(n/10)%60).padStart(2,'0')+'.'+n%10;
}

try{
records=JSON.parse(localStorage.getItem('handballScores')||'[]');
}catch(e){}

function rank(){
$('rank').replaceChildren();
records.slice(0,10).forEach(r=>{
let li=document.createElement('li');
li.textContent=r.name+' — '+r.score+'/10 — '+fmt(r.elapsed);
$('rank').append(li);
});
}
rank();

function stats(){
$('score').textContent=score;
$('left').textContent=left;
}

function resetBall(){x=170;y=345}

$('start').onclick=()=>{
player=$('name').value.trim();
if(!player){
$('msg').textContent='اكتب اسم اللاعب أولاً';
return;
}
started=performance.now();
elapsed=0;
active=true;
drag=false;
flight=null;
score=0;
left=10;
resetBall();
stats();
$('player').textContent=player;
$('timer').textContent=fmt(0);
$('share').hidden=true;
$('msg').textContent='اسحب الكرة بإصبعك وأفلتها داخل المرمى';
};

function pos(e){
let r=c.getBoundingClientRect();
return [
Math.max(12,Math.min(328,(e.clientX-r.left)*340/r.width)),
Math.max(12,Math.min(388,(e.clientY-r.top)*400/r.height))
];
}

function down(e){
if(!active||flight)return;
let p=pos(e);
if(Math.hypot(p[0]-x,p[1]-y)>48)return;
drag=true;
move(e);
}

function move(e){
if(drag){[x,y]=pos(e)}
}

function up(e){
if(!drag)return;
move(e);
drag=false;
if(y<140){
flight={x,y,t:performance.now()};
left--;
stats();
}else{
$('msg').textContent='يمكنك تحريك الكرة مجدداً حتى المرمى';
}
}

if(window.PointerEvent){
c.addEventListener('pointerdown',e=>{
e.preventDefault();
down(e);
if(drag)try{c.setPointerCapture(e.pointerId)}catch{}
});
c.addEventListener('pointermove',move);
c.addEventListener('pointerup',up);
c.addEventListener('pointercancel',()=>drag=false);
}else{
c.addEventListener('touchstart',e=>{
e.preventDefault();
down(e.touches[0]);
},{passive:false});
c.addEventListener('touchmove',e=>{
e.preventDefault();
move(e.touches[0]);
},{passive:false});
c.addEventListener('touchend',e=>up(e.changedTouches[0]));
c.addEventListener('touchcancel',()=>drag=false);
}

function finish(){
elapsed=performance.now()-started;
$('timer').textContent=fmt(elapsed);
active=false;
records.push({name:player,score,elapsed});
records.sort((a,b)=>b.score-a.score||(a.elapsed??Infinity)-(b.elapsed??Infinity));
records=records.slice(0,50);
try{
localStorage.setItem('handballScores',JSON.stringify(records));
}catch{}
rank();
$('msg').textContent=player+' — نتيجتك النهائية: '+score+'/10 — الوقت: '+fmt(elapsed);
$('share').hidden=false;
}

$('share').onclick=async()=>{
let text=player+' — تحدي كرة اليد: '+score+'/10 — الوقت: '+fmt(elapsed);
try{
if(navigator.share)await navigator.share({text});
else if(navigator.clipboard){
await navigator.clipboard.writeText(text);
$('msg').textContent='تم نسخ النتيجة';
}else prompt('انسخ النتيجة',text);
}catch{}
};

function frame(t){
if(active)$('timer').textContent=fmt(Math.max(0,t-started));
k=170+Math.sin(t/500)*90;

if(flight&&t-flight.t>180){
let goal=flight.x>51&&flight.x<289&&flight.y>25&&flight.y<125&&Math.abs(flight.x-k)>34;
if(goal)score++;
stats();
$('msg').textContent=goal?'هدف رائع! 🔥':'لم تسجل هذه المرة';
flight=null;
resetBall();
if(!left)finish();
}

g.fillStyle='#d6a66d';
g.fillRect(0,0,340,400);
g.strokeStyle='#e7c59c';
g.lineWidth=1;
for(let i=0;i<400;i+=20){
g.beginPath();
g.moveTo(0,i);
g.lineTo(340,i);
g.stroke();
}

g.fillStyle='#327c99';
g.beginPath();
g.ellipse(170,75,160,165,0,0,Math.PI);
g.fill();
g.strokeStyle='white';
g.lineWidth=3;
g.stroke();

g.fillStyle='#203d4c';
g.fillRect(45,20,250,110);
g.lineWidth=1;
g.strokeStyle='#849aa5';

for(let i=45;i<295;i+=12){
g.beginPath();
g.moveTo(i,20);
g.lineTo(i,130);
g.stroke();
}
for(let i=20;i<130;i+=12){
g.beginPath();
g.moveTo(45,i);
g.lineTo(295,i);
g.stroke();
}

g.lineWidth=8;
g.strokeStyle='white';
g.strokeRect(45,20,250,110);
g.strokeStyle='#d64b48';
g.setLineDash([12,12]);
g.strokeRect(45,20,250,110);
g.setLineDash([]);

g.strokeStyle='#ffd166';
g.lineWidth=11;
g.lineCap='round';
g.beginPath();
g.moveTo(k-30,52);
g.lineTo(k,75);
g.lineTo(k+30,52);
g.moveTo(k,91);
g.lineTo(k-17,122);
g.moveTo(k,91);
g.lineTo(k+17,122);
g.stroke();

g.fillStyle='#ffd166';
g.fillRect(k-14,62,28,34);
g.fillStyle='#eab994';
g.beginPath();
g.arc(k,47,11,0,7);
g.fill();

if(left||flight){
g.fillStyle='#f58a35';
g.beginPath();
g.arc(x,y,17,0,7);
g.fill();
g.strokeStyle='#914a25';
g.lineWidth=2;
g.beginPath();
g.arc(x,y,17,0,7);
g.moveTo(x-17,y);
g.quadraticCurveTo(x,y-14,x+17,y);
g.stroke();
}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
